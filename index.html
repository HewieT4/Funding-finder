      /* Ensure window.fetch setter compatibility if any polyfill or runner attempts window.fetch = ... */
      (function() {
        try {
          var target = window;
          var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
          if (!desc && target.Window && target.Window.prototype) {
            target = target.Window.prototype;
            desc = Object.getOwnPropertyDescriptor(target, 'fetch');
          }
          if (desc && desc.get && !desc.set) {
            var origFetch = window.fetch ? window.fetch.bind(window) : null;
            var currentFetch = origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // ignore
        }
      })();
